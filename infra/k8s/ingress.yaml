apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terraiq-ingress
  namespace: terraiq
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - app.terraiq.io
        - api.terraiq.io
      secretName: terraiq-tls
  rules:
    - host: api.terraiq.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terraiq-backend
                port:
                  number: 80
    - host: app.terraiq.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terraiq-frontend
                port:
                  number: 80
