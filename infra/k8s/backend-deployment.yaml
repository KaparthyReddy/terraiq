apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraiq-backend
  namespace: terraiq
  labels:
    app: terraiq-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: terraiq-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terraiq-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/terraiq-backend:IMAGE_TAG
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terraiq-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: terraiq-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: terraiq-secrets
                  key: secret-key
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "terraiq-kafka:9092"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: terraiq-backend
  namespace: terraiq
spec:
  selector:
    app: terraiq-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
