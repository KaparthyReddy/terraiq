apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraiq-frontend
  namespace: terraiq
  labels:
    app: terraiq-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraiq-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terraiq-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/terraiq-frontend:IMAGE_TAG
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: terraiq-frontend
  namespace: terraiq
spec:
  selector:
    app: terraiq-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
